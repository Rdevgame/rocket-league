<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket League - 3D Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            font-size: 24px;
            font-weight: bold;
        }

        #score {
            text-align: center;
            font-size: 48px;
            margin-bottom: 20px;
        }

        .team-score {
            display: inline-block;
            margin: 0 30px;
        }

        .blue { color: #00d4ff; }
        .orange { color: #ff6600; }

        #gameTime {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
        }

        #playerInfo {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
        }

        .boost-bar {
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #00d4ff;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .boost-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            transition: width 0.1s;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
        }

        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading Rocket League...</p>
        </div>

        <div id="hud">
            <div id="score">
                <span class="blue team-score"><span id="blueScore">0</span></span>
                <span style="color: #999;">-</span>
                <span class="orange team-score"><span id="orangeScore">0</span></span>
            </div>
            <div id="gameTime">Time: <span id="timeDisplay">5:00</span></div>
        </div>

        <div id="playerInfo">
            <div>Boost: <span id="boostPercent">100</span>%</div>
            <div class="boost-bar">
                <div class="boost-fill" id="boostFill" style="width: 100%;"></div>
            </div>
            <div style="margin-top: 10px;">
                <div>Speed: <span id="speed">0</span> UU/s</div>
                <div>Height: <span id="height">0.0</span> m</div>
            </div>
        </div>

        <div id="controls">
            <div>⬅️➡️ - Steer</div>
            <div>⬆️⬇️ - Throttle</div>
            <div>SPACE - Jump</div>
            <div>SHIFT - Boost</div>
            <div>CTRL - Handbrake</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/game.js"></script>
</body>
</html>
