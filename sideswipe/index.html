<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket League Sideswipe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e27; font-family: Arial; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #gameContainer { width: 100%; max-width: 800px; height: 600px; position: relative; background: #1a1f3a; border: 3px solid #00d4ff; overflow: hidden; box-shadow: 0 0 20px #00d4ff; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 20px; left: 20px; right: 20px; color: #00d4ff; font-size: 20px; font-weight: bold; }
        #score { text-align: center; font-size: 32px; }
        .team { display: inline-block; margin: 0 20px; }
        .blue { color: #00d4ff; }
        .orange { color: #ff6600; }
        #controls { position: absolute; bottom: 20px; left: 20px; color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        <div id="ui">
            <div id="score">
                <span class="team blue"><span id="blueScore">0</span></span>
                <span>-</span>
                <span class="team orange"><span id="orangeScore">0</span></span>
            </div>
        </div>
        <div id="controls">
            <div>↑↓ MOVE | SPACE JUMP | A/D ROTATE</div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
