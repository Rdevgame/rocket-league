<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket League Sideswipe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0e27; 
            font-family: 'Arial', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            flex-direction: column;
        }
        #gameContainer { 
            width: 90vw; 
            max-width: 800px; 
            height: 600px; 
            position: relative; 
            background: #1a1f3a; 
            border: 3px solid #00d4ff; 
            overflow: hidden; 
            box-shadow: 0 0 20px #00d4ff;
            margin-bottom: 20px;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        #ui { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            right: 20px; 
            color: #00d4ff; 
            font-size: 20px; 
            font-weight: bold; 
        }
        #score { 
            text-align: center; 
            font-size: 48px;
            text-shadow: 0 0 10px #00d4ff;
        }
        .team { 
            display: inline-block; 
            margin: 0 20px; 
        }
        .blue { color: #00d4ff; }
        .orange { color: #ff6600; }
        #controls { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            color: #888; 
            font-size: 14px;
            text-align: center;
            width: calc(100% - 40px);
        }
        #title {
            color: #00d4ff;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 10px #00d4ff;
            margin-bottom: 20px;
        }
        #instructions {
            color: #888;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="title">🚀 ROCKET LEAGUE SIDESWIPE</div>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        <div id="ui">
            <div id="score">
                <span class="team blue"><span id="blueScore">0</span></span>
                <span style="color: #fff;">-</span>
                <span class="team orange"><span id="orangeScore">0</span></span>
            </div>
        </div>
        <div id="controls">
            <div>⬆️⬇️ MOVE | SPACE JUMP</div>
        </div>
    </div>
    <div id="instructions">
        Blue (Left) vs Orange (Right) • Get the ball in the goal!
    </div>
    <script src="game.js"></script>
</body>
</html>
